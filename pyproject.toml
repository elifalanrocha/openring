[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openring"
version = "0.1.6"
description = "Open-source, self-hosted Vapi alternative for voice AI agents. Vapi-compatible API, no per-minute platform fee."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[deepgram,openai,elevenlabs,silero,websocket,runner]>=1.15,<2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  # WebRTC for browser test calls; pipecat-ai[webrtc] would also pull OpenCV, used only for video.
  "aiortc>=1.14,<2",
  # Ed25519 signatures on Telnyx webhooks (aiortc already brings it).
  "cryptography>=42",
  # Reads PDFs for knowledge bases; pure Python.
  "pypdf>=5,<7",
  # SIP's G.711 audio (openring/sip.py): the standard library lost `audioop` in Python 3.13, and Pipecat 1.16
  # stopped bringing this replacement.
  "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
kokoro = ["pipecat-ai[kokoro]>=1.15,<2"]
# Free speech-to-text on this computer (faster-whisper).
whisper = ["pipecat-ai[whisper]>=1.15,<2"]
dev = ["pytest>=8", "ruff>=0.13"]

[project.scripts]
openring = "openring.__main__:main"

[tool.hatch.build.targets.sdist]
# README screenshots are linked from GitHub; the source package doesn't need to carry them.
exclude = ["docs/assets/screenshots"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["openring"]
known-local-folder = ["test_api", "test_call_flow"]  # tests import shared fixtures from each other
