name: Docker image

# A tag like v0.2.0 publishes ghcr.io/<owner>/openring with the tags 0.2.0, 0.2 and latest.
# "Run workflow" by hand publishes the tag `edge` from the branch you pick, to try the image before a release.
# Uses the repository's own token: nothing to store. The first push makes the package private; make it public once
# under the repository's Packages settings (see docs/releasing.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build, then check the image answers /health before it is pushed
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openring:check
      - run: |
          docker run -d --name openring -p 8000:8000 openring:check
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          docker logs openring
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
